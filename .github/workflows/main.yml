name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AC8265: ${{ secrets.AC8265 }}
          B606A1: ${{ secrets.B606A1 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('AC8265', '')
          bm = os.environ.get('B606A1', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- c227bbf2aba65ada0245bb3b32698e -->', gm)
          if bm:
              s2 = s2.replace('<!-- 3a221f4e003d750099c1e8fd7e8a433946 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
